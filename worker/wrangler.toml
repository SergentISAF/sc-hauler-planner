name = "sc-hauler-planner-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Set via: wrangler kv namespace create HAULER_KV
# Then replace the id below with the one from the output.
kv_namespaces = [
  { binding = "HAULER_KV", id = "c3cccbed085842cb945db722988a9b02" }
]

# Custom domain routing — Worker handles all /api/* paths on the domain.
routes = [
  { pattern = "scrapwavesurvivors.com/api/*", zone_name = "scrapwavesurvivors.com" }
]

# Secrets — set via wrangler secret put <NAME>:
#   ANTHROPIC_API_KEY     — your Anthropic API key (sk-ant-...)
#   STRIPE_SECRET_KEY     — your Stripe secret key (sk_live_... or sk_test_...)
#
# Vars — edit values below as needed.
[vars]
ALLOWED_ORIGIN     = "https://scrapwavesurvivors.com"
PUBLIC_URL         = "https://scrapwavesurvivors.com"
CREDITS_PER_PACK   = "200"
PACK_PRICE_CENTS   = "500"
SMALL_CREDITS      = "50"
SMALL_PRICE_CENTS  = "200"
PACK_CURRENCY      = "eur"
PACK_PRODUCT_NAME  = "SC Hauler Planner — 200 credits"
SUPPORT_EMAIL      = "dev@scrapwavesurvivors.com"
CLAUDE_MODEL       = "claude-sonnet-4-6"
EMAIL_FROM         = "SC Hauler Planner <noreply@offoverdrive.com>"
REPLY_TO           = "dev@scrapwavesurvivors.com"
# RESEND_API_KEY sættes som secret: wrangler secret put RESEND_API_KEY
